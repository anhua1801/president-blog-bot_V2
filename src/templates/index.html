<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社長ボット</title>
    <!-- marked: convierte la respuesta Markdown del bot en HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== Estilos base ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", "Hiragino Sans", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ===== Contenedor del chat ===== */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Cabecera ===== */
        .chat-header {
            background: #2c3e50;
            color: #fff;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        /* ===== Zona de mensajes ===== */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Cada mensaje */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        /* Mensaje del usuario (derecha, azul) */
        .message.user {
            align-self: flex-end;
            background: #0084ff;
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        /* Mensaje del bot (izquierda, gris) */
        .message.assistant {
            align-self: flex-start;
            background: #e9ecef;
            color: #1a1a1a;
            border-bottom-left-radius: 2px;
        }
        .message.assistant p { margin: 0 0 8px 0; }
        .message.assistant p:last-child { margin-bottom: 0; }

        /* ===== Zona de entrada ===== */
        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #ddd;
            gap: 8px;
        }
        #user-input {
            flex: 1;
            resize: none;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            height: 44px;
            max-height: 120px;
        }
        #send-button {
            background: #0084ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #send-button:hover { background: #006fd6; }
        #send-button:disabled { background: #b0c4de; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🎩 社長ボット</div>

        <!-- Aquí se van agregando los mensajes -->
        <div id="chat-messages" class="chat-messages">
            <div class="message assistant">こんにちは！どのようなことでお手伝いできますか？</div>
        </div>

        <!-- Caja de texto + botón enviar -->
        <div class="chat-input">
            <textarea id="user-input" placeholder="メッセージを入力..."></textarea>
            <button id="send-button">送信</button>
        </div>
    </div>

    <script>
        // ===== Referencias a los elementos del DOM =====
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // ===== Agrega un mensaje a la pantalla =====
        // role: 'user' o 'assistant'. isMarkdown: si el texto es Markdown (respuesta del bot)
        function addMessage(role, content, isMarkdown = false) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            // Si es Markdown lo parseamos a HTML; si no, texto plano
            div.innerHTML = isMarkdown ? marked.parse(content) : content;
            chatMessages.appendChild(div);
            // Auto-scroll hacia el último mensaje
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return div;
        }

        // ===== Función principal: enviar mensaje al backend =====
        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;  // no enviar vacío

            // Bloqueamos input mientras responde (evita doble envío)
            userInput.disabled = true;
            sendButton.disabled = true;

            // Mostramos el mensaje del usuario y limpiamos la caja
            addMessage('user', message);
            userInput.value = '';

            // Creamos un div vacío para ir llenando la respuesta del bot en vivo
            const botDiv = addMessage('assistant', '');
            let fullText = "";  // acumula toda la respuesta

            try {
                // Llamada al backend Flask. La clave DEBE ser "message" (lo espera request.json['message'])
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                // Leemos la respuesta en STREAMING (token por token)
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;  // terminó el stream
                    // Decodificamos el trozo recibido y lo agregamos
                    fullText += decoder.decode(value, { stream: true });
                    // Mostramos el texto acumulado (todavía como texto plano)
                    botDiv.textContent = fullText;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                // Al terminar, convertimos todo el Markdown a HTML bonito
                botDiv.innerHTML = marked.parse(fullText.trim());

            } catch (error) {
                // Si algo falla (red, servidor), lo mostramos en vez de quedar en blanco
                botDiv.textContent = "⚠️ エラーが発生しました: " + error.message;
                console.error("Error al llamar /chat:", error);
            } finally {
                // Pase lo que pase, reactivamos el input
                userInput.disabled = false;
                sendButton.disabled = false;
                userInput.focus();
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ===== Conexiones de eventos (SIN depender de nada más) =====
        // Click en el botón enviar
        sendButton.addEventListener('click', handleSend);

        // Enter para enviar (Shift+Enter = salto de línea)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
